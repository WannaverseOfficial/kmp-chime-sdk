name: Check Format

on:
  push:
    branches: [ 'development' ]
  pull_request:
    branches: [ 'development' ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'oracle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check formatting (Spotless / ktlint)
        run: ./gradlew spotlessCheck
